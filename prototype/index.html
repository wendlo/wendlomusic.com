<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wendlo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<script src="config.js"></script>
<style>
  :root{
    --bone:#F4EFE6; --ink:#1A1714; --persimmon:#E0A32B; --butter:#F2C14E;
    --nav-font:"Montserrat",system-ui,sans-serif;   /* real site: Proxima Nova */
    --hand:"Caveat",cursive;
    --stripes:url("assets/stripes.jpg");
    --ease:cubic-bezier(.72,0,.18,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0e0d0c;color:var(--bone);font-family:var(--nav-font);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 12px 40px}

  .controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;font-size:13px;color:#bdb6ab}
  .controls strong{color:#fff;font-weight:600;letter-spacing:.02em}
  .seg{display:inline-flex;border:1px solid #3a3631;border-radius:999px;overflow:hidden}
  .seg button{background:transparent;color:#bdb6ab;border:0;padding:7px 16px;font:inherit;cursor:pointer}
  .seg button.on{background:var(--persimmon);color:#2a0e06;font-weight:600}
  .hint{font-size:12px;color:#7e7872;max-width:520px;text-align:center}

  .device{position:relative;transition:width .4s var(--ease),height .4s var(--ease)}
  .device.desktop{width:min(1180px,94vw);height:min(700px,72vh)}
  .device.mobile{width:392px;height:760px;max-height:84vh}
  .device.mobile .stage{border-radius:36px;border:10px solid #050505;box-shadow:0 0 0 2px #2a2724}

  /* preview / fill mode: no chrome, fill the viewport (used inside the admin iframe and on real phones) */
  body.fill{padding:0;display:block;gap:0}
  body.fill .controls{display:none}
  body.fill .device,body.fill .device.desktop,body.fill .device.mobile{width:100vw;height:100vh;height:100dvh;max-height:none;transition:none}
  body.fill .stage,body.fill .device.mobile .stage{border-radius:0;border:none;box-shadow:none}

  .stage{position:relative;width:100%;height:100%;overflow:hidden;border-radius:14px;background:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.5)}

  .track{display:flex;height:100%;width:100%;transition:transform .68s var(--ease);will-change:transform}
  .room{flex:0 0 100%;height:100%;position:relative;overflow:hidden}
  .room.off{display:none}
  @media (prefers-reduced-motion:reduce){.track{transition:opacity .3s}}

  .hero{position:absolute;inset:0;background-size:cover;background-position:var(--focal,center)}
  .device.mobile .hero{background-position:var(--focal-m,var(--focal,center))}
  .hero::after{content:"";position:absolute;inset:0}
  .room[data-page=home] .hero{animation:kb 24s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
  .scrim-l::after{background:linear-gradient(to right,rgba(0,0,0,.7) 0%,rgba(0,0,0,.18) 45%,transparent 72%)}

  /* announcement bar */
  .annbar{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:42;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:var(--persimmon);color:#2a0e06;border:0;border-radius:0 0 12px 12px;padding:8px 18px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);display:none}
  .annbar.on{display:block}

  /* logo / email cta / nav */
  .logo{position:absolute;top:3.6%;left:4.6%;z-index:30;height:clamp(46px,6.4vw,82px);width:auto;cursor:pointer;
    filter:invert(1) drop-shadow(0 3px 12px rgba(0,0,0,.4));transition:height .5s var(--ease)}
  .logo.custom{filter:drop-shadow(0 3px 12px rgba(0,0,0,.4))}
  .stage.content .logo{height:clamp(38px,5vw,60px)}

  .email-cta{position:absolute;right:13.4%;top:62.8%;transform:rotate(-4deg);z-index:31;color:#fff;text-decoration:none;
    font-weight:700;font-size:clamp(15px,1.8vw,22px);letter-spacing:.01em;white-space:nowrap;
    text-shadow:0 2px 12px rgba(0,0,0,.65);cursor:pointer;transition:opacity .4s var(--ease),color .25s}
  .email-cta:hover{color:var(--butter);text-decoration:underline}
  .clickhere{position:absolute;right:33.2%;top:60.2%;width:clamp(75px,8vw,110px);z-index:30;transform:rotate(-3deg);
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.45));pointer-events:auto;cursor:pointer;transition:opacity .4s var(--ease)}
  .stage:not(.at-home) .email-cta,.stage:not(.at-home) .clickhere,.email-cta.off,.clickhere.off{opacity:0;pointer-events:none}

  .nav{position:absolute;right:6%;z-index:30;display:flex;
    transition:top .6s var(--ease),right .6s var(--ease),gap .6s var(--ease)}
  .nav.bottom{top:84%;right:6%;flex-direction:row;align-items:flex-end;gap:22px}
  .nav.side{top:6%;right:5%;flex-direction:column;align-items:flex-end;gap:12px}
  .navlink{display:block;position:relative;background-repeat:no-repeat;background-position:center;background-size:contain;cursor:pointer;
    opacity:.9;filter:drop-shadow(0 2px 6px rgba(0,0,0,.62));transition:opacity .25s,transform .25s,height .6s var(--ease)}
  .navlink:hover{opacity:1;transform:translateY(-2px)}
  .navlink.on{opacity:1}
  .navlink.text{font-family:var(--nav-font);font-weight:700;color:#fff;text-decoration:none;text-transform:lowercase;line-height:1;
    background:none;text-shadow:0 2px 6px rgba(0,0,0,.62);display:flex;align-items:flex-end}
  .navlink.text.on{color:var(--persimmon)}
  .nav.bottom .navlink{height:clamp(20px,2.45vw,32px)}
  .nav.bottom .navlink.text{font-size:clamp(16px,1.95vw,25px)}
  .nav.side .navlink{height:clamp(13px,1.35vw,19px)}
  .nav.side .navlink.text{font-size:clamp(11px,1.1vw,15px)}
  .navbadge{position:absolute;top:-7px;right:-11px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--persimmon);color:#2a0e06;font-family:var(--nav-font);font-size:10px;font-weight:700;line-height:1;display:none;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .stage.has-cart:not(.store-active) .navlink[data-go=store] .navbadge{display:flex}

  /* nav handwriting art (white + accent variants) */
  .navlink[data-go=home]{background-image:url(assets/nav/home-white.gif);aspect-ratio:446/156}
  .navlink[data-go=home].on{background-image:url(assets/nav/home-mustard.gif)}
  .navlink[data-go=tour]{background-image:url(assets/nav/tour-white.gif);aspect-ratio:353/152}
  .navlink[data-go=tour].on{background-image:url(assets/nav/tour-mustard.gif)}
  .navlink[data-go=contact]{background-image:url(assets/nav/contact-white.gif);aspect-ratio:584/150}
  .navlink[data-go=contact].on{background-image:url(assets/nav/contact-mustard.gif)}
  .navlink[data-go=music]{background-image:url(assets/nav/music-white.gif);aspect-ratio:439/150}
  .navlink[data-go=music].on{background-image:url(assets/nav/music-mustard.gif)}
  .navlink[data-go=store]{background-image:url(assets/nav/store-white.gif);aspect-ratio:391/143}
  .navlink[data-go=store].on{background-image:url(assets/nav/store-mustard.gif)}

  /* ABOUT */
  .about-copy{position:absolute;left:5%;bottom:17%;z-index:10;width:min(64%,560px)}
  .about-copy h2{font-family:var(--nav-font);font-weight:700;font-size:clamp(26px,4.2vw,52px);line-height:1.04;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.5)}
  .about-copy p{margin-top:14px;font-size:clamp(13px,1.3vw,16px);line-height:1.6;color:rgba(255,255,255,.92);max-width:46ch;text-shadow:0 1px 10px rgba(0,0,0,.55);white-space:pre-line}

  /* TOUR — right half, floating over hero */
  .room[data-page=tour] .hero::after{background:linear-gradient(to left,rgba(0,0,0,.5),rgba(0,0,0,.12) 55%,transparent 78%)}
  .shows-panel{position:absolute;top:0;right:0;height:100%;width:50%;z-index:10;display:flex;flex-direction:column;
    padding:clamp(40px,6vh,68px) 0 clamp(76px,16%,120px)}
  .shows-scrollwrap{position:relative;flex:1;min-height:0}
  .shows-list{height:100%;overflow-y:scroll;padding:4px 16px 24px 30px;scrollbar-width:thin;scrollbar-color:var(--persimmon) rgba(255,255,255,.3)}
  .shows-list::-webkit-scrollbar{width:10px}
  .shows-list::-webkit-scrollbar-track{background:rgba(255,255,255,.24);border-radius:10px;margin:6px 2px}
  .shows-list::-webkit-scrollbar-thumb{background:var(--persimmon);border-radius:10px;border:2px solid rgba(0,0,0,.15)}
  .show{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.3)}
  .show .date{flex:0 0 46px;text-align:center;line-height:1}
  .show .date b{display:block;font-family:var(--nav-font);font-weight:700;font-size:21px;color:var(--butter);text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .show .date span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75)}
  .show .meta{flex:1}
  .show .meta b{font-size:13px;color:#fff;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .show .meta span{display:block;font-size:11px;color:rgba(255,255,255,.82);margin-top:2px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .show .acts{display:flex;flex-direction:row;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .show .rsvp{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#2a0e06;background:var(--persimmon);padding:6px 11px;border-radius:999px;text-decoration:none;white-space:nowrap;text-align:center;transition:.2s}
  .show .rsvp:hover{background:#fff;color:var(--ink)}
  .show .rsvp.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)}
  .show .rsvp.ghost:hover{background:#fff;color:var(--ink);border-color:#fff}
  .shows-fade{position:absolute;left:0;right:10px;bottom:0;height:54px;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.5),transparent)}
  .scroll-hint{padding:14px 30px 0;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--butter);display:flex;align-items:center;gap:6px;animation:bob 1.6s ease-in-out infinite;text-shadow:0 1px 8px rgba(0,0,0,.7);transition:opacity .3s ease}
  .scroll-hint.hide{opacity:0;pointer-events:none}
  .shows-empty{padding:18px 30px;color:rgba(255,255,255,.9);font-size:14px;line-height:1.6;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .shows-empty a{color:var(--butter);text-decoration:none}
  @keyframes bob{50%{transform:translateY(4px)}}

  /* CONTACT */
  .contact-block{position:absolute;left:0;top:clamp(96px,11vw,124px);bottom:0;width:50%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 4% 2%}
  .contact-polaroids{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:5;pointer-events:none}
  .contact-card{display:flex;flex-direction:column;align-items:center;max-width:100%;
    background:rgba(18,13,16,.44);backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%);
    border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:24px 26px;box-shadow:0 26px 64px rgba(0,0,0,.45)}
  .contact-block h2{font-family:var(--nav-font);font-weight:700;font-size:clamp(26px,3.6vw,42px);color:#fff;margin:0 0 16px;text-shadow:0 3px 22px rgba(0,0,0,.7)}
  .cbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
  .cgroup{display:flex;flex-direction:column;align-items:center;gap:8px;width:180px}
  .cbtn{width:100%;background:var(--persimmon);border:0;border-radius:10px;padding:13px 16px;cursor:pointer;color:#2a0e06;font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.02em;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:.22s}
  .cbtn:hover{background:#fff;color:var(--ink);transform:translateY(-2px)}
  .cbtn.gform{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.5);color:#fff;margin-top:2px}
  .csub{font-size:11.5px;color:#fff;text-align:center;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,.9)}
  .cmail{font-size:12px;line-height:1.6;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,.9)}
  .cmail a{color:var(--butter);text-decoration:none}
  .follow{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
  .follow-lbl{height:clamp(18px,2.4vw,25px);width:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
  .socials{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .socials a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink);font-size:17px;text-decoration:none;transition:.2s;font-weight:800}
  .socials a b{font-size:12px;letter-spacing:-.03em}
  .socials a:hover{background:var(--persimmon);color:#fff;transform:translateY(-3px)}

  /* MUSIC + STORE + BLOG shared */
  .room .bg{position:absolute;inset:0;background:var(--stripes) center/cover no-repeat}
  .content{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
  .music-head,.store-head,.blog-head{padding:clamp(74px,11vh,118px) 0 6px;max-width:600px;margin:0 auto}
  .blog-head h2{font-family:var(--nav-font);font-weight:700;font-size:clamp(26px,3.2vw,40px);color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5);padding:0 4px}

  .songs{padding:16px 16px 90px;display:flex;flex-direction:column;gap:16px;max-width:600px;margin:0 auto}
  .song{display:flex;gap:14px}
  .song.img-first .card-art{order:-1}
  .song .card{flex:1 1 0;aspect-ratio:1/1;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.28)}
  .card-text{background:#fff;padding:16px 17px;display:flex;flex-direction:column;color:var(--ink)}
  .card-text h3{font-family:var(--nav-font);font-weight:700;font-size:clamp(15px,3.2vw,19px);line-height:1.08}
  .card-text .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--persimmon);margin:3px 0 6px}
  .card-text p{font-size:clamp(11px,2.5vw,13px);line-height:1.45;color:#5b534b;overflow:hidden}
  .card-text .listen{margin-top:auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-top:8px;flex-wrap:wrap}
  .card-text .listen span{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#9b938a;margin-right:1px}
  .card-text .listen a{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--ink);color:#fff;text-decoration:none;transition:.2s}
  .card-text .listen a b{font-size:11px;font-weight:800;letter-spacing:-.02em}
  .card-text .listen a:hover{background:var(--persimmon);transform:translateY(-2px)}
  .card-art{background-size:cover;background-position:center}
  .ytentry{border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.28);background:#000;aspect-ratio:16/9;position:relative}
  .ytentry iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  /* BLOG */
  .blog-wrap{padding:16px 16px 90px;display:flex;flex-direction:column;gap:16px;max-width:600px;margin:0 auto}
  .bpost{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.28);color:var(--ink);cursor:pointer;transition:transform .2s}
  .bpost:hover{transform:translateY(-3px)}
  .bpost .cover{aspect-ratio:16/9;background-size:cover;background-position:center}
  .bpost .binfo{padding:16px 18px 18px}
  .bpost .bdate{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--persimmon);margin-bottom:5px}
  .bpost h3{font-family:var(--nav-font);font-weight:700;font-size:19px;line-height:1.15}
  .bpost .bex{font-size:13px;line-height:1.5;color:#5b534b;margin-top:7px}
  .bpost .more{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--persimmon);padding-bottom:2px}
  .barticle{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.28);color:var(--ink)}
  .barticle .cover{aspect-ratio:16/9;background-size:cover;background-position:center}
  .barticle .abody{padding:22px 24px 28px}
  .barticle .bdate{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--persimmon);margin-bottom:6px}
  .barticle h2{font-family:var(--nav-font);font-weight:700;font-size:26px;line-height:1.1;margin-bottom:14px}
  .barticle .prose{font-size:14px;line-height:1.7;color:#3d372f}
  .barticle .prose p{margin-bottom:12px}
  .barticle .prose h3{font-weight:700;font-size:17px;margin:18px 0 8px}
  .barticle .prose a{color:var(--persimmon)}
  .barticle .prose img{max-width:100%;border-radius:10px;margin:8px 0}
  .barticle .prose blockquote{border-left:3px solid var(--persimmon);padding-left:12px;color:#6c645c;margin:12px 0;font-style:italic}
  .bback{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;background:none;border:0;font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;cursor:pointer;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .blog-empty{color:rgba(255,255,255,.85);text-align:center;padding:30px;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.6)}

  /* STORE */
  .store-embed{padding:20px 5% 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:20px;max-width:1080px;margin:0 auto}
  .prod{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.22);cursor:pointer;transition:transform .2s,box-shadow .2s}
  .prod:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.26)}
  .prod .media{position:relative;aspect-ratio:4/5;overflow:hidden;background:#e9e2d5}
  .prod .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .prod .media .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#b3a892;font-size:30px}
  .prod .segs{position:absolute;top:9px;left:9px;right:9px;display:flex;gap:4px;z-index:2;opacity:0;transition:opacity .2s;pointer-events:none}
  .prod:hover .segs{opacity:1}
  .prod .segs span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.5);box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .prod .segs span.on{background:#fff}
  .prod .info{padding:12px 14px;color:var(--ink)}
  .prod .info b{font-size:14px;display:block}
  .prod .info .price{font-size:13px;color:#8a8178;display:block;margin-top:1px}
  .buy{margin-top:10px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px;font:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.2s}
  .buy:hover{background:var(--persimmon);color:#2a0e06}
  .buy:disabled{opacity:.6;cursor:default}
  .soldout{margin-top:10px;display:block;font-size:11px;color:#a89f94;letter-spacing:.06em;text-transform:uppercase}
  /* product gallery lightbox */
  .pgal{position:absolute;inset:0;z-index:70;background:rgba(10,9,8,.84);display:none;align-items:center;justify-content:center;padding:4%}
  .pgal.open{display:flex}
  .pgal-inner{position:relative;width:min(540px,94%);height:min(720px,92%);background:var(--bone);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .pgal-stage{position:relative;background:#e9e2d5;flex:1;min-height:0}
  .pgal-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .pgal-x{position:absolute;top:10px;right:12px;z-index:3;background:rgba(0,0,0,.55);color:#fff;border:0;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;line-height:1}
  .pgal-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;line-height:1}
  .pgal-prev{left:10px}.pgal-next{right:10px}
  .pgal-dots{display:flex;gap:6px;justify-content:center;padding:12px 0 2px}
  .pgal-dots span{width:7px;height:7px;border-radius:50%;background:#cfc6b6;cursor:pointer}
  .pgal-dots span.on{background:var(--ink)}
  .pgal-meta{padding:6px 18px 20px;text-align:center;color:var(--ink)}
  .pgal-meta h3{font-size:19px;font-weight:700}
  .pgal-meta .price{color:#8a8178;font-size:14px;margin:3px 0 12px;display:block}
  .pgal-sizes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 8px}
  .pgal-size{min-width:44px;padding:8px 12px;border:1.5px solid #d8cdbb;background:#fff;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
  .pgal-size:hover:not(:disabled){border-color:var(--ink)}
  .pgal-size.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pgal-size:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
  .pgal-stock{font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px;min-height:15px;font-weight:600}
  .pgal-stock.in{color:#1d9e75}
  .pgal-stock.out{color:#a89f94}
  /* cart */
  .cartbtn{position:absolute;bottom:24px;right:26px;z-index:55;display:none;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:12px 18px;font:inherit;font-size:13px;font-weight:600;letter-spacing:.03em;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.35)}
  .stage.store-active .cartbtn{display:inline-flex}
  .cartbtn i{font-size:18px}
  .cartbtn .cnt{background:var(--persimmon);color:#2a0e06;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:700;padding:0 5px}
  .device.mobile .cartbtn{bottom:22px;left:18px;right:auto}
  .cartov{position:absolute;inset:0;z-index:64;background:rgba(10,9,8,.5);opacity:0;pointer-events:none;transition:opacity .3s}
  .cartov.open{opacity:1;pointer-events:auto}
  .cartdrawer{position:absolute;top:0;right:0;bottom:0;width:min(380px,90%);z-index:65;background:var(--bone);color:var(--ink);transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
  .cartdrawer.open{transform:translateX(0)}
  .cartdrawer header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 14px;border-bottom:1px solid #e3d9c8}
  .cartdrawer header h3{font-size:18px;font-weight:700;color:var(--ink)}
  .cartdrawer .cx{background:none;border:0;font-size:24px;cursor:pointer;color:#8a8178;line-height:1}
  .cartitems{flex:1;overflow-y:auto;padding:6px 20px}
  .cartline{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #e9e1d3}
  .cartline img{width:56px;height:70px;object-fit:cover;border-radius:8px;background:#e9e2d5;flex:0 0 auto}
  .cl-info{flex:1;min-width:0}
  .cl-info b{font-size:14px;color:var(--ink);display:block}
  .cl-sz{font-size:12px;color:#8a8178}
  .cl-pr{font-size:13px;color:var(--ink);margin-top:2px}
  .cl-qty{display:inline-flex;align-items:center;margin-top:8px;border:1px solid #d8cdbb;border-radius:8px;overflow:hidden}
  .cl-qty button{width:26px;height:26px;border:0;background:#fff;cursor:pointer;font-size:15px;color:var(--ink);line-height:1}
  .cl-qty span{min-width:26px;text-align:center;font-size:13px}
  .cl-rm{background:none;border:0;color:#a89f94;font-size:11px;cursor:pointer;align-self:flex-start;margin-left:6px;text-decoration:underline}
  .cartfoot{padding:16px 20px 22px;border-top:1px solid #e3d9c8}
  .cartfoot .sub{display:flex;justify-content:space-between;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:14px}
  .cartfoot .co{width:100%;background:var(--persimmon);color:#2a0e06;border:0;border-radius:999px;padding:14px;font:inherit;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
  .cartfoot .co:disabled{opacity:.5;cursor:default}
  .cartempty{padding:44px 20px;text-align:center;color:#8a8178;font-size:14px}

  /* mobile nav button + sheet */
  .mnav-btn,.mnav-sheet{display:none}
  .device.mobile .nav,.device.mobile .email-cta,.device.mobile .clickhere{display:none}
  .device.mobile .mnav-btn{display:grid;position:absolute;bottom:22px;right:18px;z-index:40;width:62px;height:62px;border-radius:50%;place-items:center;background:var(--persimmon);color:#2a0e06;border:0;cursor:pointer;font-size:26px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .device.mobile .mnav-sheet{display:flex;position:absolute;inset:0;z-index:45;flex-direction:column;justify-content:center;align-items:flex-start;gap:26px;padding:0 12% 40px;background:rgba(14,13,12,.94);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
  .device.mobile .mnav-sheet.open{opacity:1;pointer-events:auto}
  .mnav-sheet .navlink{height:44px;flex:none}
  .mnav-sheet .navlink.text{font-size:34px}
  .mnav-sheet .close{position:absolute;top:20px;right:22px;font-size:30px;color:#fff;background:none;border:0;cursor:pointer}

  /* mobile HOME: show the full nav (vertical stack, thumb side) + the email CTA; hide the menu FAB */
  .device.mobile .stage.at-home .nav{display:flex;top:auto;bottom:6%;right:6%;flex-direction:column;align-items:flex-end;gap:15px}
  .device.mobile .stage.at-home .nav .navlink{height:23px}
  .device.mobile .stage.at-home .nav .navlink.text{font-size:19px}
  .device.mobile .stage.at-home .mnav-btn{display:none}
  .device.mobile .stage.at-home .email-cta{display:block;right:7%;top:15%;font-size:15.5px}

  /* mobile layout overrides */
  .device.mobile .logo,.device.mobile.stage .logo{height:46px}
  .device.mobile .about-copy{left:0;right:0;bottom:16%;width:100%;padding:0 8%}
  .device.mobile .about-copy p{max-width:none}
  .device.mobile .shows-panel{top:auto;bottom:0;height:74%;width:100%;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,.18));padding:24px 0 0}
  .device.mobile .shows-list{padding-bottom:96px}
  .device.mobile .contact-block{left:0;top:auto;bottom:0;width:100%;height:58%;justify-content:flex-end;padding-bottom:12%}
  .device.mobile .contact-polaroids{top:0;left:0;width:100%;height:42%;object-fit:contain;object-position:center}
  .device.mobile .cbtns{flex-direction:column;width:100%}
  .device.mobile .cgroup{width:100%}
  /* mobile MUSIC: tighter, smaller blocks */
  .device.mobile .songs{max-width:320px;padding:12px 0 90px;gap:14px}
  .device.mobile .song{flex-direction:column;gap:0;border-radius:13px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.26)}
  .device.mobile .song .card{flex:none;width:100%;border-radius:0;box-shadow:none}
  .device.mobile .card-art{order:-1;aspect-ratio:1/1}
  .device.mobile .card-text{aspect-ratio:auto;min-height:0;padding:13px 15px}
  .device.mobile .card-text h3{font-size:16px}
  .device.mobile .card-text p{font-size:12px}
  .device.mobile .card-text .listen a{width:31px;height:31px;font-size:15px}
  .device.mobile .blog-wrap{max-width:330px;padding:12px 0 90px}
  .device.mobile .music-head,.device.mobile .store-head,.device.mobile .blog-head{max-width:330px}

  /* contact sheet / modal */
  .sheet{position:absolute;inset:0;z-index:60;background:rgba(10,9,8,.6);display:none;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheet .panel{background:var(--bone);color:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:26px 26px 30px;max-height:92%;overflow:auto}
  .device.desktop .sheet{align-items:center}
  .device.desktop .sheet .panel{border-radius:18px}
  .sheet h3{font-family:var(--nav-font);font-weight:700;font-size:24px;margin-bottom:4px}
  .sheet .sub{font-size:13px;color:#6c645c;margin-bottom:18px}
  .sheet label{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#8a8178;margin:12px 0 5px}
  .sheet label em{color:var(--persimmon);font-style:normal}
  .sheet input,.sheet textarea{width:100%;border:1px solid #d8cdbb;border-radius:10px;padding:11px 13px;font:inherit;background:#fff}
  .sheet input.err,.sheet textarea.err{border-color:#c0392b}
  .sheet .submit{margin-top:18px;background:var(--persimmon);color:#2a0e06;border:0;border-radius:999px;padding:13px 26px;font-weight:600;font-size:14px;cursor:pointer}
  .sheet .submit:disabled{opacity:.6}
  .sheet .x{float:right;background:none;border:0;font-size:24px;cursor:pointer;color:#8a8178}
  .sheet .success{text-align:center;padding:34px 10px}
  .sheet .success i{font-size:44px;color:var(--persimmon)}
  .sheet .success h3{margin-top:10px}
  .sheet .success p{font-size:14px;color:#6c645c;margin-top:6px}
  .sheet .gframe{width:100%;height:min(70vh,640px);border:0;border-radius:10px;background:#fff}
</style>
</head>
<body>
  <div class="controls">
    <strong>Wendlo — interaction prototype</strong>
    <span class="seg" id="seg">
      <button data-d="desktop" class="on">Desktop</button>
      <button data-d="mobile">Mobile</button>
    </span>
    <span class="hint">click the nav (or logo) · sections slide sideways · <a href="admin/" style="color:#bdb6ab">admin console →</a></span>
  </div>

  <div class="device desktop" id="device">
    <div class="stage at-home" id="stage">

      <button class="annbar" id="annBar"></button>
      <img class="logo" id="logo" src="assets/wendlo-logo.gif" alt="Wendlo" data-go="home">
      <a class="email-cta" id="emailCta" data-go="contact" data-sheet="email">join our email list!</a>
      <img class="clickhere" id="clickHere" data-go="contact" data-sheet="email" src="assets/click-here-white.gif" alt="" aria-hidden="true">

      <nav class="nav bottom" id="nav"></nav>

      <div class="track" id="track">

        <section class="room" data-page="home"><div class="hero"></div></section>

        <section class="room scrim-l" data-page="about">
          <div class="hero"></div>
          <div class="about-copy"><h2 id="aboutHeading"></h2><p id="aboutBody"></p></div>
        </section>

        <section class="room" data-page="tour">
          <div class="hero"></div>
          <div class="shows-panel">
            <div class="shows-scrollwrap">
              <div class="shows-list" id="showsList"></div>
              <div class="shows-fade"></div>
            </div>
            <div class="scroll-hint"><i class="ti ti-arrow-down"></i> scroll for more</div>
          </div>
        </section>

        <section class="room" data-page="contact">
          <div class="bg"></div>
          <img class="contact-polaroids" id="polaroids" src="assets/contactv2.png" alt="Wendlo polaroids">
          <div class="contact-block"><div class="contact-card" id="contactCard"></div></div>
        </section>

        <section class="room" data-page="music">
          <div class="bg"></div>
          <div class="content">
            <div class="music-head"></div>
            <div class="songs" id="songs"></div>
          </div>
        </section>

        <section class="room" data-page="store">
          <div class="bg"></div>
          <div class="content">
            <div class="store-head"></div>
            <div class="store-embed" id="store"></div>
          </div>
        </section>

        <section class="room" data-page="blog">
          <div class="bg"></div>
          <div class="content">
            <div class="blog-head"><h2 id="blogHeading"></h2></div>
            <div class="blog-wrap" id="blogWrap"></div>
          </div>
        </section>

      </div><!-- /track -->

      <button class="mnav-btn" id="mnavBtn" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
      <nav class="mnav-sheet" id="mnavSheet"></nav>

      <div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>

      <div class="pgal" id="pgal">
        <div class="pgal-inner">
          <button class="pgal-x" id="pgalX" aria-label="Close">&times;</button>
          <div class="pgal-stage">
            <button class="pgal-nav pgal-prev" id="pgalPrev" aria-label="Previous">&#8249;</button>
            <img id="pgalImg" alt="">
            <button class="pgal-nav pgal-next" id="pgalNext" aria-label="Next">&#8250;</button>
          </div>
          <div class="pgal-dots" id="pgalDots"></div>
          <div class="pgal-meta"><h3 id="pgalTitle"></h3><span class="price" id="pgalPrice"></span>
            <div class="pgal-sizes" id="pgalSizes"></div><div class="pgal-stock" id="pgalStock"></div>
            <div id="pgalBuy"></div></div>
        </div>
      </div>

      <button class="cartbtn" id="cartBtn"><i class="ti ti-shopping-bag"></i> Bag <span class="cnt" id="cartCnt">0</span></button>
      <div class="cartov" id="cartOv"></div>
      <aside class="cartdrawer" id="cartDrawer">
        <header><h3>Your bag</h3><button class="cx" id="cartClose" aria-label="Close">&times;</button></header>
        <div class="cartitems" id="cartItems"></div>
        <div class="cartfoot">
          <div class="sub"><span>Subtotal</span><span id="cartSub">$0.00</span></div>
          <button class="co" id="cartCheckout">Checkout</button>
        </div>
      </aside>

    </div>
  </div>

<script>
/* =========================================================
   Wendlo site runtime — renders everything from WendloStore
   ========================================================= */
const IS_PREVIEW = new URLSearchParams(location.search).has('preview');
let CFG = WendloStore.published();

const stage=document.getElementById('stage'), track=document.getElementById('track'),
      nav=document.getElementById('nav'), mnavSheet=document.getElementById('mnavSheet'),
      device=document.getElementById('device');

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const stripScripts = html => String(html||'').replace(/<script[\s\S]*?<\/script>/gi,'');

const DEFAULT_ASSETS = { homeHero:'assets/home.jpg', aboutHero:'assets/about.jpg', tourHero:'assets/shows.jpg',
  polaroids:'assets/contactv2.png', stripes:'assets/stripes.jpg', logo:'assets/wendlo-logo.gif' };
const GIF_NAV = new Set(['home','tour','contact','music','store']);   // pages with handwriting nav art

/* ---------- navigation between rooms ---------- */
const SIDE_PAGES = new Set(['music','store','blog']);   // pages where the nav docks top-right
let current='home';
const enabledPages = () => CFG.pages.order.filter(p=>CFG.pages.enabled[p]);
function go(page, instant){
  const list=enabledPages();
  if(!list.includes(page)) page=list[0]||'home';
  current=page;
  const idx=list.indexOf(page);
  if(instant) track.style.transition='none';
  track.style.transform='translateX('+(-idx*100)+'%)';
  if(instant) requestAnimationFrame(()=>requestAnimationFrame(()=>track.style.transition=''));
  const side=SIDE_PAGES.has(page);
  stage.classList.toggle('at-home',page==='home');
  stage.classList.toggle('content',side);
  stage.classList.toggle('store-active',page==='store');
  nav.classList.toggle('side',side); nav.classList.toggle('bottom',!side);
  document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('on',a.dataset.go===page));
  const room=track.querySelector(`[data-page="${page}"]`);
  if(room){ room.scrollTop=0; const sc=room.querySelector('.content'); if(sc) sc.scrollTop=0; }
  mnavSheet.classList.remove('open');
  if(page==='tour') setTimeout(updateHint,80);
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-go]'); if(!el) return;
  go(el.dataset.go);
  if(el.dataset.sheet) openSheet(el.dataset.sheet);
});

/* ---------- nav rendering ---------- */
function navLinkHtml(page){
  const label=esc(CFG.pages.labels[page]||page);
  const badge= page==='store' ? '<span class="navbadge"></span>' : '';
  if(GIF_NAV.has(page)) return `<a data-go="${page}" class="navlink" aria-label="${label}">${badge}</a>`;
  return `<a data-go="${page}" class="navlink text" aria-label="${label}">${label}${badge}</a>`;
}
function renderNav(){
  const list=enabledPages();
  nav.innerHTML=list.map(navLinkHtml).join('');
  mnavSheet.innerHTML='<button class="close" id="mnavClose" aria-label="Close">&times;</button>'+list.map(navLinkHtml).join('');
  document.getElementById('mnavClose').addEventListener('click',()=>mnavSheet.classList.remove('open'));
  document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('on',a.dataset.go===current));
  renderCartBadges();
}
document.getElementById('mnavBtn').addEventListener('click',()=>mnavSheet.classList.add('open'));

/* ---------- design / heroes / chrome ---------- */
function applyDesign(){
  document.documentElement.style.setProperty('--persimmon', CFG.design.accent||'#E0A32B');
  document.documentElement.style.setProperty('--stripes', `url("${CFG.design.stripes||DEFAULT_ASSETS.stripes}")`);
  const logo=document.getElementById('logo');
  logo.src=CFG.design.logo||DEFAULT_ASSETS.logo;
  logo.classList.toggle('custom', !!CFG.design.logo);
  document.title=CFG.site.title||'Wendlo';
  let md=document.querySelector('meta[name=description]');
  if(!md){ md=document.createElement('meta'); md.name='description'; document.head.appendChild(md); }
  md.content=CFG.site.description||'';
  const ann=document.getElementById('annBar');
  ann.classList.toggle('on', !!CFG.site.announcement.enabled && !!CFG.site.announcement.text);
  ann.textContent=CFG.site.announcement.text||'';
  ann.onclick=()=>go(CFG.site.announcement.page||'contact');
}
function setHero(page, src, focal, focalM, fallback){
  const room=track.querySelector(`[data-page="${page}"]`); if(!room) return;
  const hero=room.querySelector('.hero'); if(!hero) return;
  hero.style.backgroundImage=`url("${src||fallback}")`;
  room.style.setProperty('--focal', focal||'center');
  room.style.setProperty('--focal-m', focalM||focal||'center');
}
function applyHeroes(){
  setHero('home', CFG.home.hero.src, CFG.home.hero.focal, CFG.home.hero.focalMobile, DEFAULT_ASSETS.homeHero);
  setHero('about', CFG.about.hero.src, CFG.about.hero.focal, CFG.about.hero.focalMobile, DEFAULT_ASSETS.aboutHero);
  setHero('tour', CFG.tour.hero.src, CFG.tour.hero.focal, CFG.tour.hero.focalMobile, DEFAULT_ASSETS.tourHero);
  document.getElementById('polaroids').src=CFG.contact.polaroids.src||DEFAULT_ASSETS.polaroids;
}
function applyPages(){
  CFG.pages.order.forEach((p,i)=>{
    const room=track.querySelector(`[data-page="${p}"]`);
    if(room){ room.style.order=i; room.classList.toggle('off', !CFG.pages.enabled[p]); }
  });
  renderNav();
  go(current, true);
}
function applyHomeExtras(){
  const cta=document.getElementById('emailCta'), ch=document.getElementById('clickHere');
  cta.textContent=CFG.home.emailCta.text||'join our email list!';
  cta.classList.toggle('off', !CFG.home.emailCta.enabled);
  ch.classList.toggle('off', !(CFG.home.clickHere.enabled && CFG.home.emailCta.enabled));
}
function applyAbout(){
  document.getElementById('aboutHeading').textContent=CFG.about.heading||'';
  document.getElementById('aboutBody').textContent=CFG.about.body||'';
}

/* ---------- contact ---------- */
const SOCIAL_ICONS={instagram:'ti-brand-instagram',tiktok:'ti-brand-tiktok',facebook:'ti-brand-facebook',
  youtube:'ti-brand-youtube',spotify:'ti-brand-spotify',apple:'ti-brand-apple',soundcloud:'ti-brand-soundcloud',
  twitter:'ti-brand-x',bandcamp:'ti-brand-bandcamp',other:'ti-link'};
function renderContact(){
  const c=CFG.contact, card=document.getElementById('contactCard');
  const gform = (c.googleForm.enabled && c.googleForm.url)
    ? `<button class="cbtn gform" data-gform>${esc(c.googleForm.label||'Fill out our form')}</button>` : '';
  const socials=c.socials.filter(s=>s.enabled&&s.url).map(s=>{
    const ic=SOCIAL_ICONS[s.platform]||SOCIAL_ICONS.other;
    return `<a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.label)}" title="${esc(s.label)}"><i class="ti ${ic}"></i></a>`;
  }).join('');
  card.innerHTML=`
    <h2>${esc(c.heading||'Get in touch')}</h2>
    <div class="cbtns">
      <div class="cgroup"><button class="cbtn" data-sheet-only="message">${esc(c.buttons.message.label)}</button><span class="csub">${esc(c.buttons.message.sub)}</span></div>
      <div class="cgroup"><button class="cbtn" data-sheet-only="email">${esc(c.buttons.email.label)}</button><span class="csub">${esc(c.buttons.email.sub)}</span></div>
    </div>
    ${gform}
    <div class="cmail">
      or email us at <a href="mailto:${esc(c.bookingEmail)}">${esc(c.bookingEmail)}</a><br>
      For licensing inquiries contact ${esc(c.licensing.name)} at <a href="mailto:${esc(c.licensing.email)}">${esc(c.licensing.email)}</a>
    </div>
    <div class="follow">
      <img class="follow-lbl" src="assets/follow-along-white.gif" alt="follow along">
      <div class="socials">${socials}</div>
    </div>`;
  card.querySelectorAll('[data-sheet-only]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.sheetOnly)));
  const gf=card.querySelector('[data-gform]'); if(gf) gf.addEventListener('click',()=>openGoogleForm());
}

/* ---------- forms (submissions stored locally + optional webhooks) ---------- */
const sheet=document.getElementById('sheet'), panel=document.getElementById('sheetPanel');
function formHtml(def){
  return def.fields.map(f=>{
    const req=f.required?' <em>*</em>':'';
    const ctl=f.type==='textarea'
      ? `<textarea data-key="${f.key}" rows="3" placeholder="${esc(f.placeholder||'')}"></textarea>`
      : `<input data-key="${f.key}" type="${f.type==='email'?'email':'text'}" placeholder="${esc(f.placeholder||'')}">`;
    return `<label>${esc(f.label)}${req}</label>${ctl}`;
  }).join('');
}
function openSheet(kind){
  const c=CFG.contact;
  const def = kind==='email' ? c.emailForm : c.messageForm;
  const title = kind==='email' ? c.buttons.email.label : c.buttons.message.label;
  panel.innerHTML=`<button class="x" data-close>&times;</button><h3>${esc(title)}</h3>
    <form data-kind="${kind}">${formHtml(def)}<button class="submit" type="submit">${esc(def.submitLabel||'Send')}</button></form>`;
  sheet.classList.add('open');
  panel.querySelector('form').addEventListener('submit', onFormSubmit);
}
function openGoogleForm(){
  panel.innerHTML=`<button class="x" data-close>&times;</button><h3>${esc(CFG.contact.googleForm.label)}</h3>
    <iframe class="gframe" src="${esc(CFG.contact.googleForm.url)}" loading="lazy"></iframe>`;
  sheet.classList.add('open');
}
async function onFormSubmit(e){
  e.preventDefault();
  const form=e.currentTarget, kind=form.dataset.kind;
  const def = kind==='email' ? CFG.contact.emailForm : CFG.contact.messageForm;
  const data={}; let ok=true;
  def.fields.forEach(f=>{
    const el=form.querySelector(`[data-key="${f.key}"]`); const v=el.value.trim();
    el.classList.remove('err');
    if(f.required && !v){ el.classList.add('err'); ok=false; }
    if(f.type==='email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ el.classList.add('err'); ok=false; }
    data[f.key]=v;
  });
  if(!ok) return;
  const btn=form.querySelector('.submit'); btn.disabled=true; btn.textContent='Sending…';
  WendloStore.submissions.add(kind==='email'?'email':'contact', data);
  const hook = kind==='email' ? CFG.contact.webhooks.email : CFG.contact.webhooks.contact;
  if(hook){ try{ await fetch(hook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({type:kind,data,ts:new Date().toISOString()})}); }catch(err){ console.warn('[form webhook]',err); } }
  panel.innerHTML=`<button class="x" data-close>&times;</button>
    <div class="success"><i class="ti ti-mail-heart"></i><h3>${esc(def.successText||'Thanks!')}</h3>
    <p>— Wendlo</p></div>`;
}
sheet.addEventListener('click',e=>{ if(e.target===sheet||e.target.hasAttribute('data-close')) sheet.classList.remove('open'); });

/* ---------- music ---------- */
const SERVICE_META={
  spotify:{label:'Spotify', icon:'<i class="ti ti-brand-spotify"></i>'},
  apple:{label:'Apple Music', icon:'<i class="ti ti-brand-apple"></i>'},
  amazon:{label:'Amazon Music', icon:'<i class="ti ti-brand-amazon"></i>'},
  deezer:{label:'Deezer', icon:'<i class="ti ti-brand-deezer"></i>'},
  itunes:{label:'iTunes', icon:'<b>iT</b>'},
  napster:{label:'Napster', icon:'<b>N</b>'},
  tidal:{label:'Tidal', icon:'<i class="ti ti-brand-tidal"></i>'},
  youtube:{label:'YouTube', icon:'<i class="ti ti-brand-youtube"></i>'}
};
function ytId(url){
  const m=String(url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  return m?m[1]:'';
}
function renderMusic(){
  const wrap=document.getElementById('songs');
  let songIdx=0;
  wrap.innerHTML=(CFG.music.entries||[]).map(en=>{
    if(en.type==='youtube'){
      const id=ytId(en.url); if(!id) return '';
      return `<div class="ytentry" title="${esc(en.title||'')}"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${esc(en.title||'YouTube video')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    }
    const links=(CFG.music.services||[]).filter(s=>en.links&&en.links[s]&&en.links[s].on&&en.links[s].url).map(s=>{
      const m=SERVICE_META[s]||{label:s,icon:'<i class="ti ti-music"></i>'};
      return `<a href="${esc(en.links[s].url)}" target="_blank" rel="noopener" aria-label="Listen on ${esc(m.label)}" title="${esc(m.label)}">${m.icon}</a>`;
    }).join('');
    const alt=(songIdx++%2===0)?' img-first':'';
    return `<div class="song${alt}">
      <div class="card card-text"><h3>${esc(en.title)}</h3><div class="tag">${esc(en.tag||'')}</div><p>${esc(en.blurb||'')}</p>
        <div class="listen">${links?'<span>listen on</span>':''}${links}</div></div>
      <div class="card card-art" style="background-image:url('${esc(en.art||'')}')"></div>
    </div>`;
  }).join('');
}

/* ---------- blog ---------- */
let blogView={mode:'list',id:null};
function renderBlog(){
  document.getElementById('blogHeading').textContent=CFG.blog.heading||'';
  const wrap=document.getElementById('blogWrap');
  const posts=(CFG.blog.posts||[]).filter(p=>p.published).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(blogView.mode==='post'){
    const p=posts.find(x=>x.id===blogView.id);
    if(p){
      const d=p.date?new Date(p.date+'T12:00:00'):null;
      const ds=d?d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'';
      wrap.innerHTML=`<div><button class="bback" data-bback><i class="ti ti-arrow-left"></i> all posts</button></div>
        <article class="barticle">${p.cover?`<div class="cover" style="background-image:url('${esc(p.cover)}')"></div>`:''}
          <div class="abody"><div class="bdate">${esc(ds)}</div><h2>${esc(p.title)}</h2>
          <div class="prose">${stripScripts(p.body)}</div></div></article>`;
      wrap.querySelector('[data-bback]').addEventListener('click',()=>{ blogView={mode:'list',id:null}; renderBlog(); });
      const room=track.querySelector('[data-page=blog] .content'); if(room) room.scrollTop=0;
      return;
    }
    blogView={mode:'list',id:null};
  }
  wrap.innerHTML = posts.length ? posts.map(p=>{
    const d=p.date?new Date(p.date+'T12:00:00'):null;
    const ds=d?d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'';
    return `<div class="bpost" data-post="${p.id}">${p.cover?`<div class="cover" style="background-image:url('${esc(p.cover)}')"></div>`:''}
      <div class="binfo"><div class="bdate">${esc(ds)}</div><h3>${esc(p.title)}</h3>
      ${p.excerpt?`<div class="bex">${esc(p.excerpt)}</div>`:''}<span class="more">Read post</span></div></div>`;
  }).join('') : '<div class="blog-empty">Nothing here yet — check back soon.</div>';
  wrap.querySelectorAll('[data-post]').forEach(el=>el.addEventListener('click',()=>{ blogView={mode:'post',id:el.dataset.post}; renderBlog(); }));
}

/* ---------- tour (Bandsintown) ---------- */
const showsList=document.getElementById('showsList');
const scrollHint=document.querySelector('.scroll-hint');
function updateHint(){ if(!showsList) return;
  const atBottom=showsList.scrollTop+showsList.clientHeight>=showsList.scrollHeight-4;
  scrollHint.classList.toggle('hide',atBottom||showsList.scrollHeight<=showsList.clientHeight+4); }
showsList.addEventListener('scroll',updateHint);
window.addEventListener('resize',updateHint);
let tourKey='';
async function loadShows(){
  const {artist,appId}=CFG.tour.bandsintown;
  const key=artist+'|'+appId;
  if(key===tourKey) return; tourKey=key;
  const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  try{
    const res=await fetch(`https://rest.bandsintown.com/artists/${encodeURIComponent(artist)}/events?app_id=${encodeURIComponent(appId)}&date=upcoming`);
    const events=await res.json();
    if(!Array.isArray(events)||!events.length){
      showsList.innerHTML=`<div class="shows-empty">${esc(CFG.tour.emptyText)}<br><a href="${esc(CFG.tour.emptyLinkUrl)}" target="_blank" rel="noopener">${esc(CFG.tour.emptyLinkText)}</a></div>`;
      scrollHint.classList.add('hide'); return;
    }
    showsList.innerHTML=events.map(e=>{
      const d=new Date(e.datetime), day=String(d.getDate()).padStart(2,'0'), mon=MON[d.getMonth()];
      const v=e.venue||{}, loc=[v.city, v.region||v.country].filter(Boolean).join(', ');
      const tix=(e.offers||[]).find(o=>o.type==='Tickets'&&o.status==='available');
      const acts=(tix?`<a class="rsvp" href="${esc(tix.url)}" target="_blank" rel="noopener">Tickets</a>`:'')+
        `<a class="rsvp ghost" href="${esc(e.url)}" target="_blank" rel="noopener">RSVP</a>`;
      return `<div class="show"><div class="date"><b>${day}</b><span>${mon}</span></div>
        <div class="meta"><b>${esc(v.name)}</b><span>${esc(loc)}</span></div>
        <div class="acts">${acts}</div></div>`;
    }).join('');
    updateHint();
  }catch(err){ console.error('[bandsintown]',err); tourKey='';   // allow retry on next config apply
    showsList.innerHTML='<div class="shows-empty">Couldn’t load shows right now.</div>'; scrollHint.classList.add('hide'); }
}

/* ---------- store (Shopify Storefront) ---------- */
let SHOPIFY={domain:'',token:'',apiVersion:'2024-10'};
const storeEl = document.getElementById('store');
const money = (a,c) => new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(a);
async function shopify(query, variables){
  const res = await fetch(`https://${SHOPIFY.domain}/api/${SHOPIFY.apiVersion}/graphql.json`,{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Shopify-Storefront-Access-Token':SHOPIFY.token},
    body:JSON.stringify({query,variables})
  });
  const json = await res.json();
  if(json.errors) throw new Error(json.errors.map(e=>e.message).join('; '));
  return json.data;
}
const galleryImgs = p => (p.images && p.images.nodes && p.images.nodes.length) ? p.images.nodes : (p.featuredImage ? [p.featuredImage] : []);
let PRODUCTS = [];
const cardAction = p => { if(!p.availableForSale) return '<span class="soldout">Sold out</span>'; const vs=p.variants.nodes; return (vs.length>1) ? '<button class="buy">Choose size</button>' : `<button class="buy" data-variant="${vs[0].id}">Add to cart</button>`; };
function renderDemoStore(){
  const demo=[['Logo Tee','$30'],['Tour Tee','$32'],['Embroidered Hoodie','$65'],['Vinyl LP','$35'],['Cassette','$12'],['Canvas Tote','$25']];
  storeEl.innerHTML=demo.map(p=>`<div class="prod"><div class="media"><div class="noimg"><i class="ti ti-shirt"></i></div></div>
    <div class="info"><b>${p[0]}</b><span class="price">${p[1]}</span></div></div>`).join('');
}
function renderProducts(){
  storeEl.innerHTML = PRODUCTS.map((p,i)=>{
    const price = money(p.priceRange.minVariantPrice.amount, p.priceRange.minVariantPrice.currencyCode);
    const imgs = galleryImgs(p);
    const media = imgs.length ? `<img class="media-img" src="${imgs[0].url}" data-i="0" alt="${esc(p.title)}">` : '<div class="noimg"><i class="ti ti-shirt"></i></div>';
    const segs = imgs.length>1 ? `<div class="segs">${imgs.map((_,k)=>`<span class="${k===0?'on':''}"></span>`).join('')}</div>` : '';
    return `<div class="prod" data-idx="${i}"><div class="media">${media}${segs}</div>
      <div class="info"><b>${esc(p.title)}</b><span class="price">${price}</span>${cardAction(p)}</div></div>`;
  }).join('');
  PRODUCTS.forEach(p=>galleryImgs(p).forEach(im=>{ const x=new Image(); x.src=im.url; }));
}
let storeKey='';
async function initStore(){
  SHOPIFY={...CFG.store.shopify};
  const key=SHOPIFY.domain+'|'+SHOPIFY.token+'|'+SHOPIFY.apiVersion;
  if(key===storeKey) return; storeKey=key;
  if(!SHOPIFY.token||!SHOPIFY.domain){ renderDemoStore(); return; }
  try{
    const data = await shopify(`{ products(first:24){ nodes{
      id title availableForSale
      featuredImage{ url altText }
      images(first:8){ nodes{ url altText } }
      priceRange{ minVariantPrice{ amount currencyCode } }
      variants(first:20){ nodes{ id title availableForSale selectedOptions{ name value } price{ amount currencyCode } } }
    } } }`);
    PRODUCTS = data.products.nodes || [];
    if(!PRODUCTS.length){ renderDemoStore(); console.warn('[store] 0 products'); return; }
    renderProducts();
  }catch(err){ console.error('[store]',err); storeKey=''; renderDemoStore(); }   // allow retry on next apply
}

/* hover-scrub through product images */
let lastMedia=null;
function resetMedia(media){ if(!media)return; const prod=media.closest('.prod'); if(!prod)return;
  const imgs=galleryImgs(PRODUCTS[+prod.dataset.idx]||{}); const img=media.querySelector('.media-img');
  if(img && imgs[0]){ img.src=imgs[0].url; img.dataset.i='0'; }
  media.querySelectorAll('.segs span').forEach((s,k)=>s.classList.toggle('on',k===0)); }
storeEl.addEventListener('mousemove', e=>{
  const media=e.target.closest('.media');
  if(media!==lastMedia){ resetMedia(lastMedia); lastMedia=media; }
  if(!media)return;
  const prod=media.closest('.prod'); const imgs=galleryImgs(PRODUCTS[+prod.dataset.idx]||{});
  if(imgs.length<2)return;
  const r=media.getBoundingClientRect();
  const idx=Math.max(0,Math.min(imgs.length-1,Math.floor((e.clientX-r.left)/r.width*imgs.length)));
  const img=media.querySelector('.media-img');
  if(img && +img.dataset.i!==idx){ img.src=imgs[idx].url; img.dataset.i=idx; }
  media.querySelectorAll('.segs span').forEach((s,k)=>s.classList.toggle('on',k===idx));
});
storeEl.addEventListener('mouseleave', ()=>{ resetMedia(lastMedia); lastMedia=null; });
storeEl.addEventListener('click', e=>{
  const buy=e.target.closest('.buy'); if(buy && buy.dataset.variant){ const prod=buy.closest('.prod'); const p=PRODUCTS[+prod.dataset.idx]; if(p) addToCartLocal(p, p.variants.nodes[0]); return; }
  const prod=e.target.closest('.prod'); if(prod && prod.dataset.idx!==undefined) openGallery(+prod.dataset.idx);
});

/* product lightbox with size picker */
const pgal=document.getElementById('pgal'), pgalImg=document.getElementById('pgalImg'),
      pgalDots=document.getElementById('pgalDots'), pgalTitle=document.getElementById('pgalTitle'),
      pgalPrice=document.getElementById('pgalPrice'), pgalSizes=document.getElementById('pgalSizes'),
      pgalStock=document.getElementById('pgalStock'), pgalBuy=document.getElementById('pgalBuy');
const sizeLabel = v => (v.selectedOptions && (v.selectedOptions.find(o=>/size/i.test(o.name))||{}).value) || v.title;
const firstAvail = vs => { const k=vs.findIndex(v=>v.availableForSale); return k<0?0:k; };
let GAL={imgs:[],i:0,vi:0,p:null};
function renderGal(){
  const {imgs,i,vi,p}=GAL; if(!imgs.length)return;
  const vs=p.variants.nodes, sel=vs[vi];
  pgalImg.src=imgs[i].url; pgalImg.alt=esc(p.title);
  pgalTitle.textContent=p.title;
  pgalPrice.textContent=money(p.priceRange.minVariantPrice.amount,p.priceRange.minVariantPrice.currencyCode);
  pgalDots.innerHTML=imgs.map((_,k)=>`<span class="${k===i?'on':''}" data-k="${k}"></span>`).join('');
  pgalSizes.innerHTML = vs.length>1 ? vs.map((v,k)=>`<button class="pgal-size ${k===vi?'on':''}" data-vi="${k}" ${v.availableForSale?'':'disabled'}>${sizeLabel(v)}</button>`).join('') : '';
  if(sel && sel.availableForSale){
    pgalStock.className='pgal-stock in'; pgalStock.textContent='In stock';
    pgalBuy.innerHTML=`<button class="buy" data-variant="${sel.id}">Add to cart</button>`;
  }else{
    pgalStock.className='pgal-stock out'; pgalStock.textContent='Sold out';
    pgalBuy.innerHTML='<button class="buy" disabled>Sold out</button>';
  }
}
function openGallery(idx){ const p=PRODUCTS[idx]; if(!p)return; const imgs=galleryImgs(p); if(!imgs.length)return; GAL={imgs,i:0,vi:firstAvail(p.variants.nodes),p}; renderGal(); pgal.classList.add('open'); }
function galStep(d){ GAL.i=(GAL.i+d+GAL.imgs.length)%GAL.imgs.length; renderGal(); }
document.getElementById('pgalPrev').addEventListener('click',()=>galStep(-1));
document.getElementById('pgalNext').addEventListener('click',()=>galStep(1));
document.getElementById('pgalX').addEventListener('click',()=>pgal.classList.remove('open'));
pgal.addEventListener('click',e=>{ if(e.target===pgal) pgal.classList.remove('open'); });
pgalDots.addEventListener('click',e=>{ const s=e.target.closest('span[data-k]'); if(s){ GAL.i=+s.dataset.k; renderGal(); } });
pgalSizes.addEventListener('click',e=>{ const b=e.target.closest('.pgal-size'); if(b && !b.disabled){ GAL.vi=+b.dataset.vi; renderGal(); } });
pgalBuy.addEventListener('click',e=>{ const b=e.target.closest('.buy'); if(b && b.dataset.variant){ addToCartLocal(GAL.p, GAL.p.variants.nodes[GAL.vi]); pgal.classList.remove('open'); } });
window.addEventListener('keydown',e=>{ if(!pgal.classList.contains('open'))return;
  if(e.key==='ArrowLeft')galStep(-1); else if(e.key==='ArrowRight')galStep(1); else if(e.key==='Escape')pgal.classList.remove('open'); });

/* ---------- on-site cart (Shopify only at checkout) ---------- */
const CART_KEY='wendlo_cart';
let CART=[]; try{ CART=JSON.parse(localStorage.getItem(CART_KEY))||[]; }catch(_){ CART=[]; }
const cartBtn=document.getElementById('cartBtn'), cartCnt=document.getElementById('cartCnt'),
      cartOv=document.getElementById('cartOv'), cartDrawer=document.getElementById('cartDrawer'),
      cartItems=document.getElementById('cartItems'), cartSub=document.getElementById('cartSub'),
      cartCheckout=document.getElementById('cartCheckout');
const fmt=(a,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD'}).format(a);
const cartCount=()=>CART.reduce((n,l)=>n+l.qty,0);
const cartSubtotal=()=>CART.reduce((s,l)=>s+l.amount*l.qty,0);
const saveCart=()=>{ try{ localStorage.setItem(CART_KEY,JSON.stringify(CART)); }catch(_){}};
const openCart=()=>{ cartOv.classList.add('open'); cartDrawer.classList.add('open'); };
const closeCart=()=>{ cartOv.classList.remove('open'); cartDrawer.classList.remove('open'); };
function addToCartLocal(product, variant){
  if(!variant) return;
  const line={ variantId:variant.id, title:product.title, size:(product.variants.nodes.length>1)?sizeLabel(variant):'',
    amount:parseFloat(variant.price.amount), currency:variant.price.currencyCode, image:(galleryImgs(product)[0]||{}).url||'', qty:1 };
  const ex=CART.find(l=>l.variantId===line.variantId); if(ex) ex.qty++; else CART.push(line);
  saveCart(); renderCart(); openCart();
}
function setQty(vid,q){ const l=CART.find(x=>x.variantId===vid); if(!l)return; l.qty=q; if(l.qty<=0) CART=CART.filter(x=>x.variantId!==vid); saveCart(); renderCart(); }
function renderCartBadges(){ const n=cartCount(); document.querySelectorAll('.navbadge').forEach(b=>b.textContent=n); stage.classList.toggle('has-cart',n>0); }
function renderCart(){
  const n=cartCount();
  cartCnt.textContent=n; cartCnt.style.display=n?'grid':'none';
  renderCartBadges();
  cartSub.textContent=fmt(cartSubtotal(), CART[0]&&CART[0].currency);
  cartCheckout.disabled=!CART.length;
  cartItems.innerHTML = CART.length ? CART.map(l=>`
    <div class="cartline"><img src="${l.image}" alt="${esc(l.title)}">
      <div class="cl-info"><b>${esc(l.title)}</b>${l.size?`<span class="cl-sz">Size ${l.size}</span>`:''}
        <div class="cl-pr">${fmt(l.amount,l.currency)}</div>
        <div class="cl-qty"><button data-act="dec" data-v="${l.variantId}">&minus;</button><span>${l.qty}</span><button data-act="inc" data-v="${l.variantId}">+</button></div>
      </div>
      <button class="cl-rm" data-act="rm" data-v="${l.variantId}">Remove</button></div>`).join('') : '<div class="cartempty">Your bag is empty.</div>';
}
cartBtn.addEventListener('click', openCart);
document.getElementById('cartClose').addEventListener('click', closeCart);
cartOv.addEventListener('click', closeCart);
cartItems.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(!b)return; const vid=b.dataset.v, l=CART.find(x=>x.variantId===vid); if(!l)return;
  if(b.dataset.act==='inc') setQty(vid,l.qty+1); else if(b.dataset.act==='dec') setQty(vid,l.qty-1); else setQty(vid,0); });
cartCheckout.addEventListener('click', async ()=>{ if(!CART.length)return; cartCheckout.disabled=true; const t=cartCheckout.textContent; cartCheckout.textContent='…';
  try{
    const d=await shopify(`mutation($lines:[CartLineInput!]!){ cartCreate(input:{lines:$lines}){ cart{ checkoutUrl } userErrors{ message } } }`, { lines: CART.map(l=>({merchandiseId:l.variantId, quantity:l.qty})) });
    const url=d.cartCreate?.cart?.checkoutUrl; if(url) window.open(url,'_blank'); else throw new Error(d.cartCreate?.userErrors?.[0]?.message || 'no checkout URL');
  }catch(err){ console.error('[cart]',err); alert('Checkout error: '+err.message); }
  finally{ cartCheckout.disabled=false; cartCheckout.textContent=t; }
});

/* ---------- device toggle (demo harness) ---------- */
const seg=document.getElementById('seg');
seg.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return;
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  setDevice(b.dataset.d); });
function setDevice(mode){
  device.classList.toggle('desktop',mode==='desktop');
  device.classList.toggle('mobile',mode==='mobile');
  setTimeout(updateHint,420);
}

/* ---------- apply everything ---------- */
function applyConfig(cfg){
  CFG=cfg;
  applyDesign(); applyHeroes(); applyHomeExtras(); applyAbout();
  renderContact(); renderMusic(); renderBlog();
  applyPages();
  loadShows(); initStore();
}

/* ---------- preview mode (admin iframe) + real-phone fill ---------- */
if(IS_PREVIEW){
  document.body.classList.add('fill');
  window.addEventListener('message',e=>{
    const d=e.data||{};
    if(d.type==='wendlo-config' && d.config) applyConfig(WendloStore.deepMerge(WENDLO_DEFAULTS,d.config));
    else if(d.type==='wendlo-device') setDevice(d.mode==='mobile'?'mobile':'desktop');
    else if(d.type==='wendlo-goto') go(d.page);
  });
  if(window.parent!==window) window.parent.postMessage({type:'wendlo-ready'},'*');
}else{
  /* real visitors: fill the screen and pick the layout by actual width, re-checked on resize/rotate */
  let autoState='';
  const autoFit=()=>{
    const small=innerWidth<=640 || (innerWidth<900 && innerWidth<innerHeight);
    const want=small?'mobile':'desktop';
    if(want===autoState) return; autoState=want;
    document.body.classList.toggle('fill', small);
    setDevice(want);
  };
  autoFit();
  window.addEventListener('resize',()=>{ clearTimeout(window.__afT); window.__afT=setTimeout(autoFit,120); });
}

applyConfig(CFG);
renderCart();
/* deployed content: pull config-published.json and re-render with it (skipped in the
   admin preview, where the console pushes its draft instead) */
if(!IS_PREVIEW) WendloStore.loadRemote().then(ok=>{ if(ok) applyConfig(WendloStore.published()); });
